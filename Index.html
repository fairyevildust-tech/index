html{scroll-snap-type:y mandatory;scroll-padding-top:env(safe-area-inset-top,0px);scroll-behavior:smooth}

*{box-sizing:border-box}

#c{position:fixed;z-index:1;top:0;left:34%;width:66%;height:100%;touch-action:pan-y;cursor:grab;transition:opacity .5s}

.txt{width:30%;max-width:380px;pointer-events:auto}

h1{font-size:clamp(44px,6vw,84px);letter-spacing:.04em}
h2{font-size:clamp(30px,3.2vw,44px)}
.sub{font-family:'Cormorant Garamond',serif;font-size:22px;margin:0 0 1.2em}
dl{margin:1.4em 0;display:grid;grid-template-columns:auto 1fr;gap:6px 18px;font-size:14px}dt{color:var(--mute)}dd{margin:0}
p{margin:.6em 0;color:#3b4048}
.v{display:inline-flex;gap:8px;align-items:center;font-size:14px}
.sw{width:14px;height:14px;border-radius:50%;border:1px solid var(--line)}
.views{display:flex;gap:8px;margin-top:1.4em}
button{font:inherit;font-size:13px;background:none;border:1px solid var(--fg);color:var(--fg);padding:7px 16px;border-radius:999px;cursor:pointer}
button:hover,button:focus-visible{background:var(--fg);color:#fff;outline:none}
nav{position:fixed;right:18px;top:50%;transform:translateY(-50%);z-index:5;display:flex;flex-direction:column;gap:10px}
nav a{width:7px;height:7px;border-radius:50%;background:#c5c9cf;transition:.3s}nav a.on{background:var(--fg);transform:scale(1.5)}
.hero .txt{width:30%;max-width:420px}.hero small{display:block;margin-top:2em;color:var(--mute)}
.fin{background:#fff}.fin .txt{width:100%;max-width:880px;margin:0 auto;padding-top:60px}
table{border-collapse:collapse;width:100%;font-size:14px;margin:1.2em 0}td,th{text-align:left;padding:10px 12px 10px 0;border-bottom:1px solid var(--line);vertical-align:top}th{font-weight:400;color:var(--mute)}
.ok{color:#1d6b3a}.no{color:#a3341f}.na{color:#6b7280}
@media(max-width:800px){
#c{left:0;width:100%;height:56%}

.txt,.hero .txt{width:100%;max-width:none}

body.ex #c{left:0!important;width:100%!important;height:100%!important;z-index:20;background:#fff;touch-action:none;opacity:1!important}

#c{cursor:pointer}
